<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d0c">
<meta name="description" content="범용 BLE OBD-II 실시간 차량 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<title>OBD Dashboard</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090d0c;
  --panel:#111615;
  --panel-border:#1c2522;
  --card-bg:#121817;
  --mint:#00e699;
  --mint-glow:rgba(0,230,153,0.35);
  --red:#ff3b47;
  --red-glow:rgba(255,59,71,0.35);
  --amber:#f59e0b;
  --amber-glow:rgba(245,158,11,0.3);
  --cyan:#38bdf8;
  --text-primary:#f5f7f6;
  --text-secondary:#7d8c87;
  --text-dim:#4a5753;
  --track-bg:#1b2421;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",system-ui,sans-serif;
  user-select:none;
}
body{
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 숫자 고정폭 tabular-nums */
.tabular, .num-val, .rpm-num, .speed-num, .boost-val, .stat-value{
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.5px;
}

/* 메인 대시보드 컨테이너: 100dvh 스크롤 없이 한 화면에 최적화 */
.app{
  width:100%;
  max-width:960px;
  height:100dvh;
  max-height:100dvh;
  padding:clamp(8px,1.5vh,16px) clamp(10px,2vw,18px);
  display:flex;
  flex-direction:column;
  gap:clamp(8px,1.2vh,14px);
  overflow:hidden;
}

/* 1. 상단 미니멀 헤더 */
header{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:30px;
}
.brand-group{
  display:flex;
  align-items:center;
  gap:8px;
}
.brand-title{
  font-size:clamp(12px,1.8vh,14px);
  font-weight:900;
  letter-spacing:1px;
  color:var(--text-secondary);
}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:clamp(10px,1.4vh,11px);
  font-weight:750;
  padding:3px 10px;
  border-radius:99px;
  background:#131b19;
  border:1px solid #1c2724;
  color:var(--text-secondary);
  transition:all .3s ease;
}
.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#6b7280;
  transition:all .3s ease;
}
.status-pill.connected{
  background:rgba(0,230,153,0.12);
  border-color:rgba(0,230,153,0.3);
  color:var(--mint);
}
.status-pill.connected .status-dot{
  background:var(--mint);
  box-shadow:0 0 8px var(--mint);
  animation:pulse-dot 2s infinite;
}
.status-pill.demo{
  background:rgba(245,158,11,0.12);
  border-color:rgba(245,158,11,0.3);
  color:var(--amber);
}
.status-pill.demo .status-dot{
  background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}
@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.85)}
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.icon-btn{
  background:transparent;
  border:1px solid transparent;
  color:var(--text-secondary);
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s ease;
}
.icon-btn:hover, .icon-btn:active{
  background:var(--card-bg);
  border-color:var(--panel-border);
  color:var(--text-primary);
}
.icon-btn svg{width:18px;height:18px;fill:currentColor}

/* 2. 중앙 메인 클러스터 (RPM 아크 + 속도) */
.main-cluster{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* RPM 아크 영역 */
.rpm-arc-box{
  position:relative;
  width:100%;
  max-width:320px;
  height:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.rpm-svg{
  width:100%;
  height:auto;
  max-height:clamp(120px, 24vh, 175px);
  display:block;
  overflow:visible;
}
.rpm-center-data{
  position:absolute;
  bottom:clamp(4px, 1.2vh, 14px);
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.rpm-num{
  font-size:clamp(36px, 6.5vh, 48px);
  font-weight:900;
  line-height:.95;
  color:var(--text-primary);
}
.rpm-unit{
  font-size:clamp(10px, 1.4vh, 12px);
  font-weight:700;
  color:var(--text-secondary);
  letter-spacing:.5px;
  margin-top:2px;
}

/* RPM 아크 바로 아래 초대형 속도계 */
.speed-cluster{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:6px;
  margin-top:clamp(2px, 0.6vh, 6px);
}
.speed-num{
  font-size:clamp(54px, 11vh, 88px);
  font-weight:950;
  line-height:.9;
  letter-spacing:-3px;
  color:var(--text-primary);
}
.speed-unit{
  font-size:clamp(14px, 2.2vh, 18px);
  font-weight:750;
  color:var(--text-secondary);
}

/* 가로 모드 전용 통합 중앙 정보 (세로 모드에서는 숨김) */
.landscape-center-info{
  display:none;
  position:absolute;
  bottom:clamp(6px, 1.5vh, 16px);
  left:0;
  right:0;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.landscape-speed-row{
  display:flex;
  align-items:baseline;
  gap:4px;
}
.landscape-speed-num{
  font-size:clamp(40px, 8.5vh, 56px);
  font-weight:950;
  line-height:.95;
  letter-spacing:-2px;
}
.landscape-speed-unit{
  font-size:clamp(12px, 1.8vh, 14px);
  font-weight:750;
  color:var(--text-secondary);
}
.landscape-rpm-num{
  font-size:clamp(24px, 4.8vh, 32px);
  font-weight:900;
  line-height:1;
  color:var(--text-secondary);
  margin-top:2px;
}

/* 3. BOOST 가로 막대형 카드 */
.boost-bar-card{
  flex:0 0 auto;
  background:var(--card-bg);
  border:1px solid var(--panel-border);
  border-radius:var(--radius-md);
  padding:clamp(8px, 1.3vh, 12px) clamp(12px, 2.2vw, 16px);
  display:flex;
  flex-direction:column;
  gap:clamp(5px, 0.8vh, 8px);
  width:100%;
}
.boost-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.kicker{
  font-size:clamp(10px, 1.4vh, 11px);
  font-weight:750;
  letter-spacing:1px;
  color:var(--text-secondary);
  text-transform:uppercase;
}
.boost-val-wrap{
  display:flex;
  align-items:baseline;
  gap:4px;
}
.boost-val{
  font-size:clamp(18px, 3vh, 23px);
  font-weight:900;
  color:var(--text-primary);
  line-height:1;
}
.boost-unit{
  font-size:clamp(10px, 1.4vh, 12px);
  font-weight:700;
  color:var(--text-secondary);
}
.boost-track{
  width:100%;
  height:clamp(8px, 1.3vh, 11px);
  background:var(--track-bg);
  border-radius:99px;
  overflow:hidden;
  position:relative;
}
.boost-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--mint), #10b981);
  border-radius:99px;
  transition:width .12s ease-out;
  box-shadow:0 0 8px var(--mint-glow);
}

/* 4. 하단 보조 지표 (2×2 그리드) */
.sub-stats-grid{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:clamp(6px, 1vh, 9px);
  width:100%;
}
.stat-card{
  background:var(--card-bg);
  border:1px solid var(--panel-border);
  border-radius:var(--radius-md);
  padding:clamp(7px, 1.2vh, 11px) clamp(10px, 1.8vw, 14px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:clamp(54px, 8.5vh, 72px);
  transition:border-color .3s ease, box-shadow .3s ease;
  min-width:0;
  overflow:hidden;
}
.stat-card-title{
  font-size:clamp(9.5px, 1.3vh, 11px);
  font-weight:750;
  letter-spacing:.8px;
  color:var(--text-secondary);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stat-value-group{
  display:flex;
  align-items:baseline;
  gap:4px;
  margin-top:clamp(2px, 0.4vh, 5px);
}
.stat-value{
  font-size:clamp(20px, 3.4vh, 28px);
  font-weight:900;
  line-height:1;
  color:var(--text-primary);
  transition:color .3s ease;
}
.stat-unit{
  font-size:clamp(10px, 1.4vh, 12px);
  font-weight:700;
  color:var(--text-secondary);
}

/* Exception-based 상태 스타일 (경고 시 앰버/레드 테두리 및 텍스트 점등) */
.stat-card.state-warn{
  border-color:rgba(245,158,11,0.65);
  box-shadow:0 0 12px var(--amber-glow);
}
.stat-card.state-warn .stat-value{
  color:var(--amber);
}
.stat-card.state-danger{
  border-color:rgba(255,59,71,0.75);
  box-shadow:0 0 14px var(--red-glow);
  animation:border-pulse 1.4s infinite;
}
.stat-card.state-danger .stat-value{
  color:var(--red);
}
.stat-card.state-cold{
  border-color:rgba(56,189,248,0.45);
}
.stat-card.state-cold .stat-value{
  color:var(--cyan);
}
@keyframes border-pulse{
  0%,100%{border-color:rgba(255,59,71,0.75)}
  50%{border-color:rgba(255,59,71,0.3)}
}

/* 5. 오디오 비주얼라이저 데코 바 */
.visualizer-box{
  flex:0 0 auto;
  width:100%;
  height:clamp(14px, 2.2vh, 22px);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:2px;
  padding:2px 4px;
  border-radius:6px;
  background:#0c1110;
  border:1px solid #16201d;
  overflow:hidden;
}
.viz-bar{
  flex:1;
  background:var(--mint);
  opacity:.65;
  border-radius:2px;
  height:20%;
  min-height:3px;
  transition:height .08s ease;
}

/* 6. 하단 컨트롤 바 (연결 시 자동 숨김) */
.bottom-controls{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}
.main-action-btn{
  width:100%;
  padding:clamp(9px, 1.4vh, 12px);
  font-size:clamp(12px, 1.8vh, 14px);
  font-weight:800;
  background:var(--mint);
  color:#04150f;
  border:0;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 2px 10px var(--mint-glow);
  transition:all .2s ease;
}
.main-action-btn:hover{background:#1affaa}
.main-action-btn:active{transform:scale(0.98)}

.bottom-sub-btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  width:100%;
}
.sub-btn{
  width:100%;
  padding:clamp(6px, 1vh, 9px);
  font-size:clamp(10px, 1.4vh, 11.5px);
  background:#141c1a;
  border:1px solid #202b28;
  color:var(--text-secondary);
  font-weight:700;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .2s ease;
}
.sub-btn:hover{background:#1d2724;color:var(--text-primary)}
.sub-btn.is-active{
  background:rgba(0,230,153,0.15);
  border-color:rgba(0,230,153,0.4);
  color:var(--mint);
}

/* 연결 완료 시 메인 하단 바 자동 숨김 */
body.is-connected .bottom-controls{
  display:none;
}

/* 7. 설정 모달 / 드로어 */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(6px);
  z-index:900;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  opacity:0;
  transition:opacity .2s ease;
}
.modal-backdrop.open{
  display:flex;
  opacity:1;
}
.modal-sheet{
  width:100%;
  max-width:400px;
  background:#121716;
  border:1px solid #23312c;
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.85);
  transform:translateY(10px);
  transition:transform .2s ease;
}
.modal-backdrop.open .modal-sheet{
  transform:translateY(0);
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1c2724;
  padding-bottom:10px;
}
.modal-title{
  font-size:14px;
  font-weight:800;
  color:var(--text-primary);
}
.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.btn{
  border:0;
  border-radius:var(--radius-sm);
  padding:10px;
  background:#18221f;
  color:var(--text-primary);
  font-size:12px;
  font-weight:750;
  cursor:pointer;
  transition:all .2s ease;
}
.btn:hover{background:#23302b}
.btn.is-active{
  background:rgba(0,230,153,0.15);
  border:1px solid rgba(0,230,153,0.4);
  color:var(--mint);
}
#diagnosticsBox{
  display:none;
  background:#090d0c;
  border:1px solid #202b28;
  border-radius:10px;
  padding:10px;
  font-size:10px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:pre-wrap;
  word-break:break-all;
  max-height:130px;
  overflow-y:auto;
  color:#94a3b8;
}

/* ========================================================
   ★ 가로 모드 (ORIENTATION: LANDSCAPE) 레이아웃
   ======================================================== */
@media (orientation: landscape) {
  .app{
    padding:clamp(6px, 1.8vh, 12px) clamp(12px, 3vw, 24px);
    gap:clamp(6px, 1.5vh, 10px);
  }
  header{
    min-height:24px;
  }
  
  /* 가로 모드 메인 프레임: 3열 분할 (좌측 날개 - 중앙 클러스터 - 우측 날개) */
  .landscape-dashboard-row{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1.6fr 1fr;
    gap:clamp(10px, 2.5vw, 20px);
    align-items:center;
    width:100%;
  }

  /* 좌측 날개 (COOLANT, OIL) */
  .wing-left{
    display:flex;
    flex-direction:column;
    gap:clamp(8px, 2vh, 14px);
    height:100%;
    justify-content:center;
  }

  /* 중앙 클러스터 (대형 RPM 아크 + 통합 속도/RPM) */
  .main-cluster{
    width:100%;
    height:100%;
    justify-content:center;
  }
  .rpm-arc-box{
    max-width:380px;
  }
  .rpm-svg{
    max-height:clamp(130px, 45vh, 210px);
  }
  /* 가로 모드에서는 아크 내부 중앙에 속도와 RPM이 통합 표시됨 */
  .rpm-center-data{
    display:none; /* 세로 전용 숨김 */
  }
  .speed-cluster{
    display:none; /* 세로 전용 숨김 */
  }
  .landscape-center-info{
    display:flex; /* 가로 전용 표시 */
  }

  /* 우측 날개 (BOOST, BATT) */
  .wing-right{
    display:flex;
    flex-direction:column;
    gap:clamp(8px, 2vh, 14px);
    height:100%;
    justify-content:center;
  }
  .wing-right .stat-card, .wing-left .stat-card{
    min-height:clamp(60px, 18vh, 90px);
  }

  /* 세로 전용 요소들 가로 모드에서 숨김/재배치 */
  .sub-stats-grid{
    display:none;
  }
  .boost-bar-card{
    display:none;
  }
}

/* ========================================================
   ★ 세로 모드 (ORIENTATION: PORTRAIT) 레이아웃
   ======================================================== */
@media (orientation: portrait) {
  .landscape-dashboard-row{
    display:contents;
  }
  .wing-left, .wing-right{
    display:contents;
  }
}
</style>
</head>
<body>

<main class="app" id="appMain">
  <!-- 1. 상단 미니멀 헤더 -->
  <header>
    <div class="brand-group">
      <span class="brand-title">OBD // DASH</span>
      <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">DISCONNECTED</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openSettingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.09-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- 가로/세로 유연한 대시보드 래퍼 -->
  <div class="landscape-dashboard-row">
    
    <!-- [가로 모드 좌측 날개] COOLANT & OIL TEMP -->
    <div class="wing-left">
      <div class="stat-card" id="cardCoolantL">
        <span class="stat-card-title">COOLANT</span>
        <div class="stat-value-group">
          <span class="stat-value" id="valCoolantL">--</span>
          <span class="stat-unit">°C</span>
        </div>
      </div>
      <div class="stat-card" id="cardOilL">
        <span class="stat-card-title">OIL TEMP</span>
        <div class="stat-value-group">
          <span class="stat-value" id="valOilL">--</span>
          <span class="stat-unit">°C</span>
        </div>
      </div>
    </div>

    <!-- [중앙 메인 클러스터] RPM 대형 아크 + 속도계 -->
    <section class="main-cluster">
      <div class="rpm-arc-box">
        <svg class="rpm-svg" viewBox="0 18 200 96" aria-label="RPM Arc Gauge">
          <!-- 눈금 숫자 (0, 2, 4, 6, 8k) -->
          <text x="18" y="106" font-size="8" fill="#4a5753" font-weight="700">0</text>
          <text x="36" y="55" font-size="8" fill="#4a5753" font-weight="700">2</text>

          <!-- 베이스 트랙 -->
          <path d="M 28 105 A 72 72 0 0 1 172 105" fill="none" stroke="#1b2421" stroke-width="12" stroke-linecap="round"/>
          <!-- 레드존 표시 구간 (6.5k ~ 8k) -->
          <path d="M 28 105 A 72 72 0 0 1 172 105" fill="none" stroke="rgba(255,59,71,0.5)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="19 100" stroke-dashoffset="-81"/>
          <!-- 활성 아크 채움선 -->
          <path id="rpmArc" d="M 28 105 A 72 72 0 0 1 172 105" fill="none" stroke="var(--mint)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" style="opacity:0; transition:opacity .15s ease, stroke .2s ease;"/>

        <!-- [세로 모드] 아크 내부 RPM 수치 -->
        <div class="rpm-center-data">

    <div class="wing-right">

      CONNECT OBD-II
    </button>

<!-- 설정 & 제어 모달/드로어 -->
<div class="modal-backdrop" id="settingsModal">

      <button class="btn" id="fullscreenBtn">FULL SCREEN</button>
      <button class="btn" id="wakeLockBtn">KEEP SCREEN ON</button>

      <button class="btn" id="disconnectBtn" style="grid-column:1/-1;background:#351316;color:var(--red);" disabled>DISCONNECT OBD-II</button>

    <pre id="diagnosticsBox"></pre>

<script>
(() => {
const $ = id => document.getElementById(id);

// --- 1. 비주얼라이저 데코 바 생성 ---
const vizBox = $('visualizerBox');
const VIZ_COUNT = 32;
for (let i = 0; i < VIZ_COUNT; i++) {
  const bar = document.createElement('div');
  bar.className = 'viz-bar';
  vizBox.appendChild(bar);
}
const vizBars = vizBox.children;
let vizPhase = 0;

function animateVisualizer(active = true, intensity = 0.5) {
  vizPhase += 0.15;
  for (let i = 0; i < VIZ_COUNT; i++) {
    if (!active) {
      vizBars[i].style.height = '15%';
      vizBars[i].style.opacity = '0.3';
      continue;
    }
    const wave1 = Math.sin(vizPhase + i * 0.4);
    const wave2 = Math.cos(vizPhase * 0.7 + i * 0.25);
    const h = Math.max(12, Math.min(100, Math.floor((Math.abs(wave1 * wave2) * 80 + 15) * (0.6 + intensity * 0.4))));
    vizBars[i].style.height = h + '%';
    vizBars[i].style.opacity = (0.4 + (h / 100) * 0.6).toFixed(2);
  }
}
setInterval(() => animateVisualizer(connected || demoActive, currentIntensity), 70);

let currentIntensity = 0.4;

// --- 2. RPM 아크 게이지 업데이트 ---
function updateRpm(rpm, maxRpm = 8000) {
  const arc = $('rpmArc');
  if (!arc) return;
  const rVal = Math.max(0, Math.min(maxRpm, Math.round(rpm || 0)));
  
  // 세로/가로 텍스트 동기화
  $('rpmVal').textContent = rVal.toLocaleString('en-US');
  $('rpmValL').textContent = rVal.toLocaleString('en-US');

  if (rVal <= 10) {
    arc.style.opacity = '0';
    arc.setAttribute('stroke-dasharray', '0 100');
    return;
  }
  arc.style.opacity = '1';
  const ratio = rVal / maxRpm;
  arc.setAttribute('stroke-dasharray', `${(ratio * 100).toFixed(1)} 100`);
  
  // 6500 RPM 이상 시 레드존 점등
  if (rVal >= 6500) {
    arc.setAttribute('stroke', 'var(--red)');
  } else {
    arc.setAttribute('stroke', 'var(--mint)');
  }

  currentIntensity = Math.min(1.0, 0.3 + (rVal / maxRpm) * 0.7);
}

// --- 3. 속도 업데이트 ---
function updateSpeed(spd) {
  const sVal = spd === null ? 0 : Math.round(spd);
  $('speedVal').textContent = sVal;
  $('speedValL').textContent = sVal;
}

// --- 4. 부스트 업데이트 ---
function updateBoost(boost) {
  const bVal = boost === null ? 0 : Math.max(0, boost);
  const text = bVal.toFixed(2);
  $('boostVal').textContent = text;
  $('valBoostL').textContent = text;

  // 세로 모드 바 채움 (최대 2.0 bar 기준)
  const ratio = Math.max(0, Math.min(1, bVal / 2.0));
  $('boostFill').style.width = (ratio * 100).toFixed(1) + '%';
}

// --- 5. 보조 지표 업데이트 (Exception-based UI) ---
function updateCoolant(temp) {
  const text = (temp === null || temp === undefined) ? '--' : Math.round(temp);
  $('valCoolant').textContent = text;
  $('valCoolantL').textContent = text;

  const cards = [$('cardCoolant'), $('cardCoolantL')];
  cards.forEach(c => {
    if (!c) return;
    c.className = 'stat-card';
    if (temp !== null && temp !== undefined) {
      if (temp < 60) c.classList.add('state-cold');
      else if (temp >= 108) c.classList.add('state-danger');
      else if (temp >= 100) c.classList.add('state-warn');
    }
  });
}

function updateOilTemp(temp) {
  const text = (temp === null || temp === undefined) ? '--' : Math.round(temp);
  $('valOil').textContent = text;
  $('valOilL').textContent = text;

  const cards = [$('cardOil'), $('cardOilL')];
  cards.forEach(c => {
    if (!c) return;
    c.className = 'stat-card';
    if (temp !== null && temp !== undefined) {
      if (temp >= 125) c.classList.add('state-danger');
      else if (temp >= 115) c.classList.add('state-warn'); // 시안처럼 121도일 때 앰버 경고 점등
    }
  });
}

function updateBattery(volts) {
  const text = (volts === null || volts === undefined) ? '--.-' : volts.toFixed(1);
  $('valVoltage').textContent = text;
  $('valVoltL').textContent = text;

  const cards = [$('cardVoltage'), $('cardVoltL')];
  cards.forEach(c => {
    if (!c) return;
    c.className = 'stat-card';
    if (volts !== null && volts !== undefined) {
      if (volts < 12.0) c.classList.add('state-danger');
      else if (volts < 12.5) c.classList.add('state-warn');
      else if (volts > 15.0) c.classList.add('state-danger');
    }
  });
}

function updateEngineLoad(load) {
  const text = (load === null || load === undefined) ? '--' : Math.round(load);
  $('valLoad').textContent = text;

  const card = $('cardLoad');
  if (!card) return;
  card.className = 'stat-card';
  if (load !== null && load !== undefined && load >= 85) {
    card.classList.add('state-warn');
  }
}

// --- 6. BLE OBD-II 통신 및 상태 관리 ---
const UUIDS = [
  {name:"ELM BLE FFF0",service:"0000fff0-0000-1000-8000-00805f9b34fb",notify:"0000fff1-0000-1000-8000-00805f9b34fb",write:"0000fff2-0000-1000-8000-00805f9b34fb"},
  {name:"ELM BLE FFE0",service:"0000ffe0-0000-1000-8000-00805f9b34fb",notify:"0000ffe1-0000-1000-8000-00805f9b34fb",write:"0000ffe1-0000-1000-8000-00805f9b34fb"},
  {name:"NORDIC UART",service:"6e400001-b5a3-f393-e0a9-e50e24dcca9e",notify:"6e400003-b5a3-f393-e0a9-e50e24dcca9e",write:"6e400002-b5a3-f393-e0a9-e50e24dcca9e"},
  {name:"CUSTOM 18F0",service:"000018f0-0000-1000-8000-00805f9b34fb",notify:"00002af0-0000-1000-8000-00805f9b34fb",write:"00002af1-0000-1000-8000-00805f9b34fb"}
];
const optionalServices = [...new Set([...UUIDS.map(x=>x.service),"0000180a-0000-1000-8000-00805f9b34fb"])];

let device = null, server = null, rx = null, tx = null;
let notifyBuffer = "", pending = null, connected = false, polling = false;
let wakeLock = null, logLines = [];
let supported = {};

const log = s => {
  logLines.unshift(new Date().toLocaleTimeString() + " " + s);
  logLines = logLines.slice(0, 30);
  $('diagnosticsBox').textContent = logLines.join("\n");
};

function setUIConnectedState(mode) {
  const pill = $('statusPill');
  const txt = $('statusText');
  const disBtn = $('disconnectBtn');
  const connBtn = $('connectBtn');

  if (mode === 'connected') {
    document.body.classList.add('is-connected');
    pill.className = 'status-pill connected';
    txt.textContent = 'CONNECTED';
    disBtn.disabled = false;
    connBtn.disabled = true;
  } else if (mode === 'demo') {
    document.body.classList.add('is-connected');
    pill.className = 'status-pill demo';
    txt.textContent = 'DEMO MODE';
    disBtn.disabled = false;
    connBtn.disabled = true;
  } else {
    document.body.classList.remove('is-connected');
    pill.className = 'status-pill';
    txt.textContent = 'DISCONNECTED';
    disBtn.disabled = true;
    connBtn.disabled = false;
  }
}

const delay = ms => new Promise(r => setTimeout(r, ms));

function onNotify(e) {
  notifyBuffer += new TextDecoder().decode(e.target.value);
  if (notifyBuffer.includes(">") && pending) {
    const p = pending;
    pending = null;
    const out = notifyBuffer;
    notifyBuffer = "";
    p(out);
  }
}

async function raw(cmd, timeout = 1400) {
  if (!tx) throw Error("BLE write characteristic unavailable");
  if (pending) throw Error("Previous OBD command still pending");
  return new Promise(async (resolve, reject) => {
    pending = resolve;
    notifyBuffer = "";
    const timer = setTimeout(() => {
      if (pending) {
        const p = pending;
        pending = null;
        p(notifyBuffer || "TIMEOUT");
      }
    }, timeout);
    try {
      const data = new TextEncoder().encode(cmd + "\r");
      if (tx.properties.writeWithoutResponse && !tx.properties.write) {
        await tx.writeValueWithoutResponse(data);
      } else {
        await tx.writeValue(data);
      }
      const original = pending;
      pending = s => { clearTimeout(timer); original(s); };
    } catch (e) {
      clearTimeout(timer);
      pending = null;
      reject(e);
    }
  });
}

async function cmd(c) {
  const r = await raw(c);
  log(">" + c + "  " + r.replace(/[\r\n]/g, " ").trim());
  return r;
}

async function findProfile(gatt) {
  for (const p of UUIDS) {
    try {
      const svc = await gatt.getPrimaryService(p.service);
      const n = await svc.getCharacteristic(p.notify);
      let w;
      try { w = await svc.getCharacteristic(p.write); } catch (e) { w = n; }
      if (!(n.properties.notify || n.properties.indicate)) continue;
      if (!(w.properties.write || w.properties.writeWithoutResponse)) continue;
      rx = n; tx = w;
      log("GATT profile: " + p.name);
      return true;
    } catch (e) {}
  }
  for (const sid of optionalServices) {
    try {
      const svc = await gatt.getPrimaryService(sid);
      const chars = await svc.getCharacteristics();
      const n = chars.find(c => c.properties.notify || c.properties.indicate);
      const w = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if (n && w) {
        rx = n; tx = w;
        log("GATT custom profile: " + sid);
        return true;
      }
    } catch (e) {}
  }
  return false;
}

function bytesFor(resp, pid) {
  const clean = resp.replace(/SEARCHING\.\.\./gi, "").replace(/[^0-9a-f]/gi, "").toUpperCase();
  const key = ("41" + pid).toUpperCase();
  const i = clean.indexOf(key);
  if (i < 0) return null;
  const pairs = clean.slice(i + key.length).match(/.{2}/g) || [];
  return pairs.map(x => parseInt(x, 16)).filter(Number.isFinite);
}

async function pid(pidCode, n, fn) {
  const r = await cmd("01" + pidCode);
  const b = bytesFor(r, pidCode);
  if (!b || b.length < n) {
    supported[pidCode] = false;
    return null;
  }
  supported[pidCode] = true;
  return fn(...b);
}

async function readVoltage() {
  const r = await cmd("ATRV");
  const m = r.match(/(\d+(?:\.\d+)?)\s*V/i);
  return m ? Number(m[1]) : null;
}

// 실시간 폴링 루프
async function poll() {
  if (polling) return;
  polling = true;
  let slowIndex = 0;
  let mapVal = null, baroVal = null;

  const slowTasks = [
    async () => {
      const v = await pid("05", 1, a => a - 40);
      updateCoolant(v);
    },
    async () => {
      const v = await pid("5C", 1, a => a - 40);
      updateOilTemp(v);
    },
    async () => {
      const v = await pid("0B", 1, a => a);
      return v;
    },
    async () => {
      const v = await pid("33", 1, a => a);
      return v;
    },
    async () => {
      const v = await pid("04", 1, a => Math.round(a * 100 / 255));
      updateEngineLoad(v);
    },
    async () => {
      const v = await readVoltage();
      updateBattery(v);
    }
  ];

  try {
    while (connected) {
      // 1순위: RPM & 속도
      const speed = await pid("0D", 1, a => a);
      if (speed !== null) updateSpeed(speed);

      const rpm = await pid("0C", 2, (a, b) => Math.round((a * 256 + b) / 4));
      if (rpm !== null) updateRpm(rpm);

      // 2순위: 완만한 지표 순차 조회
      try {
        const t = slowTasks[slowIndex]();
        slowIndex = (slowIndex + 1) % slowTasks.length;
        const res = await t;
        if (slowIndex === 3) mapVal = res;
        if (slowIndex === 4) baroVal = res;
        if (mapVal !== null && baroVal !== null) {
          const boost = Math.max(0, (mapVal - baroVal) / 100);
          updateBoost(boost);
        }
      } catch (err) {
        log("PID sub: " + err.message);
      }

      await delay(90);
    }
  } catch (e) {
    log("Polling stopped: " + e.message);
  }
  polling = false;
}

async function startBLE() {
  if (demoActive) stopDemo();
  if (!navigator.bluetooth) {
    alert("이 브라우저는 Web Bluetooth를 지원하지 않습니다. Chrome/Android 환경에서 이용하세요.");
    return;
  }
  // 1) 사용자 제스처 컨텍스트에서 WakeLock 즉시 요청
  if (autoRoutine) {
    await enableWakeLock();
  }

  $('statusText').textContent = 'SEARCHING...';
  try {
    device = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices});
    log("Device: " + (device.name || "Unnamed"));
    device.addEventListener("gattserverdisconnected", () => {
      connected = false;
      setUIConnectedState('disconnected');
      log("GATT disconnected");
      disableWakeLock();
      exitFullscreenSafe();
    });

    server = await device.gatt.connect();
    if (!await findProfile(server)) throw Error("호환 BLE 프로파일을 찾지 못했습니다.");
    await rx.startNotifications();
    rx.addEventListener("characteristicvaluechanged", onNotify);
    connected = true;

    for (const c of ["ATZ","ATE0","ATL0","ATS0","ATH0","ATSP0"]) {
      await cmd(c);
      await delay(100);
    }
    setUIConnectedState('connected');

    // 2) BLE 연결 성공 직후: 자동 풀스크린 진입
    if (autoRoutine) {
      await requestFullscreenSafe();
    }

    poll();
  } catch (err) {
    log("BLE Err: " + err.message);
    setUIConnectedState('disconnected');
    if (device?.gatt?.connected) device.gatt.disconnect();
    disableWakeLock();
    exitFullscreenSafe();
  }
}

function disconnectBLE() {
  connected = false;
  if (device?.gatt?.connected) device.gatt.disconnect();
  setUIConnectedState('disconnected');
  disableWakeLock();
  exitFullscreenSafe();
}

// --- 7. DEMO 모드 (시뮬레이터) ---
let demoActive = false;
let demoTimer = null;
let demoPhase = 0;

function startDemo() {
  if (connected) disconnectBLE();
  demoActive = true;
  setUIConnectedState('demo');
  $('modalDemoBtn').textContent = 'DEMO MODE: ON';
  $('modalDemoBtn').classList.add('is-active');

  let currentSpeed = 0;
  let currentRpm = 850;
  let targetSpeed = 0;
  let gear = 1;
  let coolantSim = 54;
  let oilSim = 95;
  let voltSim = 12.3;

  demoTimer = setInterval(() => {
    demoPhase += 0.05;

    const cycle = Math.sin(demoPhase * 0.4);
    if (cycle > 0) {
      targetSpeed = 40 + cycle * 125;
    } else {
      targetSpeed = 20 + Math.abs(cycle) * 35;
    }
    currentSpeed += (targetSpeed - currentSpeed) * 0.08;

    // RPM & 변속 시뮬레이션
    if (currentSpeed < 30) {
      gear = 1;
      currentRpm = 1000 + currentSpeed * 90;
    } else if (currentSpeed < 65) {
      gear = 2;
      currentRpm = 1800 + (currentSpeed - 30) * 80;
    } else if (currentSpeed < 105) {
      gear = 3;
      currentRpm = 2200 + (currentSpeed - 65) * 75;
    } else {
      gear = 4;
      currentRpm = 2800 + (currentSpeed - 105) * 60;
    }
    if (cycle > 0.8) currentRpm = Math.min(7600, currentRpm + 1800);

    const boostSim = Math.max(0, (currentRpm > 3000 ? (currentRpm - 2500) / 3800 : 0.1) * (cycle > 0 ? 1.25 : 0.2));

    // 수온 & 유온 시뮬레이션
    coolantSim += 0.08;
    if (coolantSim > 105) coolantSim = 88;

    oilSim = coolantSim + 33; // 121도 도달 시뮬레이션
    if (oilSim > 130) oilSim = 98;

    voltSim = 13.8 + Math.sin(demoPhase) * 0.3;
    const loadSim = Math.min(96, Math.max(18, (currentRpm / 7500) * 100));

    // UI 반영
    updateSpeed(currentSpeed);
    updateRpm(currentRpm);
    updateBoost(boostSim);
    updateCoolant(coolantSim);
    updateOilTemp(oilSim);
    updateBattery(voltSim);
    updateEngineLoad(loadSim);
  }, 60);
}

function stopDemo() {
  demoActive = false;
  if (demoTimer) clearInterval(demoTimer);
  demoTimer = null;
  setUIConnectedState('disconnected');
  $('modalDemoBtn').textContent = 'DEMO MODE: OFF';
  $('modalDemoBtn').classList.remove('is-active');

  // 리셋
  updateSpeed(0);
  updateRpm(0);
  updateBoost(0);
  updateCoolant(null);
  updateOilTemp(null);
  updateBattery(null);
  updateEngineLoad(null);
}

// --- 8. 화면 유지(WakeLock) & 풀스크린 & 제어 루틴 ---
let autoRoutine = localStorage.getItem('obd_auto_routine') !== 'false';

function updateAutoRoutineButton() {
  const btn = $('autoRoutineBtn');
  if (!btn) return;
  btn.textContent = `AUTO FULLSCREEN & WAKE: ${autoRoutine ? 'ON' : 'OFF'}`;
  btn.classList.toggle('is-active', autoRoutine);
}
updateAutoRoutineButton();

function updateFullscreenButtons(isActive) {
  const text = isActive ? 'EXIT FULLSCREEN' : 'FULL SCREEN';
  if ($('fullscreenBtn')) {
    $('fullscreenBtn').textContent = text;
    $('fullscreenBtn').classList.toggle('is-active', isActive);
  }
  if ($('quickFullscreenBtn')) {
    $('quickFullscreenBtn').textContent = text;
    $('quickFullscreenBtn').classList.toggle('is-active', isActive);
  }
}

function updateWakeButtons(isActive) {
  const text = isActive ? 'SCREEN ON ✓' : 'KEEP SCREEN ON';
  if ($('wakeLockBtn')) {
    $('wakeLockBtn').textContent = text;
    $('wakeLockBtn').classList.toggle('is-active', isActive);
  }
  if ($('quickWakeBtn')) {
    $('quickWakeBtn').textContent = text;
    $('quickWakeBtn').classList.toggle('is-active', isActive);
  }
}

async function enableWakeLock() {
  if (wakeLock) return true;
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      updateWakeButtons(true);
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        updateWakeButtons(false);
      });
      return true;
    }
  } catch (e) {
    log("WakeLock Err: " + e.message);
  }
  return false;
}

async function disableWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
    updateWakeButtons(false);
  }
}

async function requestFullscreenSafe() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
    updateFullscreenButtons(true);
  } catch (e) {
    log("Auto Fullscreen: " + e.message);
  }
}

async function exitFullscreenSafe() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }
  } catch (e) {}
  updateFullscreenButtons(false);
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    log("Fullscreen Err: " + e.message);
  }
}

async function toggleWakeLock() {
  if (wakeLock) {
    await disableWakeLock();
  } else {
    await enableWakeLock();
  }
}

document.addEventListener('fullscreenchange', () => {
  updateFullscreenButtons(!!document.fullscreenElement);
});

// --- 9. 이벤트 바인딩 ---
$('connectBtn').onclick = startBLE;
$('disconnectBtn').onclick = () => {
  if (demoActive) stopDemo();
  else disconnectBLE();
  $('settingsModal').classList.remove('open');
};

$('autoRoutineBtn').onclick = () => {
  autoRoutine = !autoRoutine;
  localStorage.setItem('obd_auto_routine', autoRoutine);
  updateAutoRoutineButton();
};

$('modalDemoBtn').onclick = () => {
  if (demoActive) stopDemo();
  else startDemo();
};

$('quickFullscreenBtn').onclick = toggleFullscreen;
$('quickWakeBtn').onclick = toggleWakeLock;
$('fullscreenBtn').onclick = toggleFullscreen;
$('wakeLockBtn').onclick = toggleWakeLock;

$('openSettingsBtn').onclick = () => $('settingsModal').classList.add('open');
$('closeSettingsBtn').onclick = () => $('settingsModal').classList.remove('open');
$('settingsModal').onclick = e => {
  if (e.target === $('settingsModal')) $('settingsModal').classList.remove('open');
};

$('toggleLogBtn').onclick = () => {
  const box = $('diagnosticsBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};

// PWA Service Worker (자동 업데이트 & 즉시 반영)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update();
    }).catch(e => log("SW Err: " + e.message));

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d0c">
<meta name="description" content="범용 BLE OBD-II 실시간 차량 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<title>OBD Dashboard</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090d0c;
  --panel:#111615;
  --panel-border:#1c2522;
  --card-bg:#121817;
  --mint:#00e699;
  --mint-glow:rgba(0,230,153,0.35);
  --red:#ff3b47;
  --red-glow:rgba(255,59,71,0.35);
  --amber:#f59e0b;
  --amber-glow:rgba(245,158,11,0.3);
  --cyan:#38bdf8;
  --text-primary:#f5f7f6;
  --text-secondary:#7d8c87;
  --text-dim:#4a5753;
  --track-bg:#1b2421;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",system-ui,sans-serif;
  user-select:none;
}
body{
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 숫자 고정폭 tabular-nums */
.tabular, .num-val, .rpm-num, .speed-num, .speed-l-num, .val-num{
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.5px;
}

/* 메인 대시보드 앱 컨테이너 (100dvh 스크롤 없이 밀착) */
.app{
  width:100%;
  max-width:960px;
  height:100dvh;
  max-height:100dvh;
  padding:clamp(6px, 1.2vh, 12px) clamp(8px, 1.8vw, 16px);
  display:flex;
  flex-direction:column;
  gap:clamp(5px, 0.9vh, 8px);
  overflow:hidden;
}

/* 1. 상단 미니멀 헤더 */
header{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:26px;
}
.brand-group{
  display:flex;
  align-items:center;
  gap:8px;
}
.brand-title{
  font-size:clamp(11px, 1.5vh, 13px);
  font-weight:900;
  letter-spacing:1px;
  color:var(--text-secondary);
}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:clamp(9.5px, 1.3vh, 11px);
  font-weight:750;
  padding:2px 9px;
  border-radius:99px;
  background:#131b19;
  border:1px solid #1c2724;
  color:var(--text-secondary);
  transition:all .3s ease;
}
.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#6b7280;
  transition:all .3s ease;
}
.status-pill.connected{
  background:rgba(0,230,153,0.12);
  border-color:rgba(0,230,153,0.3);
  color:var(--mint);
}
.status-pill.connected .status-dot{
  background:var(--mint);
  box-shadow:0 0 8px var(--mint);
  animation:pulse-dot 2s infinite;
}
.status-pill.demo{
  background:rgba(245,158,11,0.12);
  border-color:rgba(245,158,11,0.3);
  color:var(--amber);
}
.status-pill.demo .status-dot{
  background:var(--amber);
  box-shadow:0 0 8px var(--amber);
}
@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.85)}
}
.icon-btn{
  background:transparent;
  border:1px solid transparent;
  color:var(--text-secondary);
  border-radius:50%;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .2s ease;
}
.icon-btn:hover, .icon-btn:active{
  background:var(--card-bg);
  border-color:var(--panel-border);
  color:var(--text-primary);
}
.icon-btn svg{width:16px;height:16px;fill:currentColor}

/* 2. 대시보드 코어 그리드 컨테이너 */
.dashboard-grid{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  width:100%;
}

/* 3. 메인 클러스터 (RPM 아크 + 속도계) */
.main-cluster{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  width:100%;
}
.rpm-arc-box{
  position:relative;
  width:100%;
  max-width:320px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.rpm-svg{
  width:100%;
  height:auto;
  max-height:clamp(115px, 22vh, 160px);
  display:block;
  overflow:visible;
}

/* 아크 내부 텍스트 영역 */
.rpm-center-box{
  position:absolute;
  bottom:clamp(4px, 1vh, 12px);
  left:0;
  right:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.rpm-num{
  font-size:clamp(34px, 6.2vh, 46px);
  font-weight:900;
  line-height:.95;
  color:var(--text-primary);
}
.rpm-unit{
  font-size:clamp(9.5px, 1.3vh, 11px);
  font-weight:750;
  color:var(--text-secondary);
  letter-spacing:.5px;
  margin-top:2px;
}

/* 가로 모드 전용 통합 속도/RPM 표시 (세로에서는 숨김) */
.landscape-center-box{
  display:none;
  position:absolute;
  bottom:clamp(4px, 1.2vh, 14px);
  left:0;
  right:0;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
}
.speed-l-row{
  display:flex;
  align-items:baseline;
  gap:4px;
}
.speed-l-num{
  font-size:clamp(38px, 8.2vh, 52px);
  font-weight:950;
  line-height:.95;
  letter-spacing:-2px;
}
.speed-l-unit{
  font-size:clamp(12px, 1.8vh, 14px);
  font-weight:750;
  color:var(--text-secondary);
}
.rpm-l-num{
  font-size:clamp(22px, 4.4vh, 28px);
  font-weight:900;
  line-height:1;
  color:var(--text-secondary);
  margin-top:2px;
}

/* 세로 모드 전용 아크 아래 대형 속도계 */
.speed-cluster{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:6px;
  margin-top:clamp(1px, 0.4vh, 4px);
}
.speed-num{
  font-size:clamp(50px, 9.5vh, 76px);
  font-weight:950;
  line-height:.9;
  letter-spacing:-3px;
  color:var(--text-primary);
}
.speed-unit{
  font-size:clamp(13px, 2vh, 16px);
  font-weight:750;
  color:var(--text-secondary);
}

/* 4. 공통 통계 카드 */
.stat-card{
  background:var(--card-bg);
  border:1px solid var(--panel-border);
  border-radius:var(--radius-md);
  padding:clamp(6px, 1vh, 10px) clamp(8px, 1.4vw, 12px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
  overflow:hidden;
  transition:border-color .3s ease, box-shadow .3s ease;
}
.card-title{
  font-size:clamp(9px, 1.3vh, 10.5px);
  font-weight:750;
  letter-spacing:.8px;
  color:var(--text-secondary);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.val-group{
  display:flex;
  align-items:baseline;
  gap:4px;
  margin-top:clamp(1px, 0.3vh, 4px);
}
.val-num{
  font-size:clamp(19px, 3vh, 25px);
  font-weight:900;
  line-height:1;
  color:var(--text-primary);
  transition:color .3s ease;
}
.val-unit{
  font-size:clamp(9.5px, 1.3vh, 11px);
  font-weight:700;
  color:var(--text-secondary);
}

/* BOOST 게이지 카드 */
.card-boost{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(4px, 0.6vh, 6px);
}
.boost-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.boost-track{
  width:100%;
  height:clamp(7px, 1.1vh, 9px);
  background:var(--track-bg);
  border-radius:99px;
  overflow:hidden;
}
.boost-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--mint), #10b981);
  border-radius:99px;
  transition:width .12s ease-out;
  box-shadow:0 0 8px var(--mint-glow);
}

/* Exception-based 상태 반응 클래스 */
.stat-card.state-warn{
  border-color:rgba(245,158,11,0.65);
  box-shadow:0 0 10px var(--amber-glow);
}
.stat-card.state-warn .val-num{
  color:var(--amber);
}
.stat-card.state-danger{
  border-color:rgba(255,59,71,0.75);
  box-shadow:0 0 12px var(--red-glow);
  animation:border-pulse 1.4s infinite;
}
.stat-card.state-danger .val-num{
  color:var(--red);
}
.stat-card.state-cold{
  border-color:rgba(56,189,248,0.45);
}
.stat-card.state-cold .val-num{
  color:var(--cyan);
}
@keyframes border-pulse{
  0%,100%{border-color:rgba(255,59,71,0.75)}
  50%{border-color:rgba(255,59,71,0.3)}
}

/* 5. OBD 데이터 기반 앰비언트 비주얼라이저 */
.visualizer-box{
  position:relative;flex:0 0 auto;width:100%;
  height:clamp(96px,14.4vh,136px);border-radius:10px;
  background:#030908;border:1px solid #18372c;overflow:hidden;
  cursor:pointer;touch-action:manipulation;
  box-shadow:inset 0 0 22px rgba(0,220,145,.07);
}
#vizCanvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.ambient-overlay{position:absolute;inset:0;display:none;flex-direction:column;
  justify-content:space-between;padding:calc(env(safe-area-inset-top) + 5.5vh) 7vw calc(env(safe-area-inset-bottom) + 5vh);
  color:rgba(244,255,249,.96);pointer-events:none;text-shadow:0 2px 24px rgba(0,0,0,.55)}
.ambient-clock{text-align:center}
.ambient-time{font-size:clamp(58px,12vw,104px);font-weight:250;letter-spacing:-.075em;line-height:.95;font-variant-numeric:tabular-nums}
.ambient-date{margin-top:13px;font-size:11px;font-weight:500;letter-spacing:.22em;color:rgba(220,245,232,.72)}
.ambient-metrics{display:flex;align-items:flex-end;justify-content:space-between;font-variant-numeric:tabular-nums}
.ambient-metric{font-size:clamp(44px,9vw,76px);font-weight:250;letter-spacing:-.065em;line-height:1;white-space:nowrap}
.ambient-metric.right{font-size:clamp(38px,7.8vw,66px);text-align:right}
.ambient-unit{font-size:.35em;letter-spacing:-.01em;font-weight:350;margin-left:.12em;color:rgba(222,245,233,.82)}
body.ambient-fullscreen .visualizer-box,
body.ambient-expanded .visualizer-box{position:fixed;inset:0;z-index:10000;width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
body.ambient-fullscreen .ambient-overlay,
body.ambient-expanded .ambient-overlay{display:flex}
@media (orientation:landscape){.ambient-overlay{padding:5vh 6vw}.ambient-time{font-size:clamp(48px,9vw,78px)}.ambient-date{margin-top:8px}.ambient-metric{font-size:clamp(38px,7vw,62px)}.ambient-metric.right{font-size:clamp(34px,6.2vw,56px)}}
/* 6. 하단 컨트롤 바 (연결 시 자동 숨김) */
.bottom-controls{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:clamp(4px, 0.7vh, 6px);
  width:100%;
}
.main-action-btn{
  width:100%;
  padding:clamp(8px, 1.3vh, 11px);
  font-size:clamp(11.5px, 1.6vh, 13px);
  font-weight:800;
  background:var(--mint);
  color:#04150f;
  border:0;
  border-radius:var(--radius-sm);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  box-shadow:0 2px 10px var(--mint-glow);
  transition:all .2s ease;
}
.main-action-btn:hover{background:#1affaa}
.main-action-btn:active{transform:scale(0.98)}

.bottom-sub-btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(4px, 0.7vh, 6px);
  width:100%;
}
.sub-btn{
  width:100%;
  padding:clamp(6px, 0.9vh, 8px);
  font-size:clamp(9.5px, 1.3vh, 11px);
  background:#141c1a;
  border:1px solid #202b28;
  color:var(--text-secondary);
  font-weight:700;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:all .2s ease;
}
.sub-btn:hover{background:#1d2724;color:var(--text-primary)}
.sub-btn.is-active{
  background:rgba(0,230,153,0.15);
  border-color:rgba(0,230,153,0.4);
  color:var(--mint);
}

/* 연결 완료 시 메인 하단 바 자동 숨김 */
body.is-connected .bottom-controls{
  display:none;
}

/* 7. 설정 모달 / 드로어 */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(6px);
  z-index:900;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  opacity:0;
  transition:opacity .2s ease;
}
.modal-backdrop.open{
  display:flex;
  opacity:1;
}
.modal-sheet{
  width:100%;
  max-width:380px;
  background:#121716;
  border:1px solid #23312c;
  border-radius:20px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.85);
  transform:translateY(10px);
  transition:transform .2s ease;
}
.modal-backdrop.open .modal-sheet{
  transform:translateY(0);
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1c2724;
  padding-bottom:8px;
}
.modal-title{
  font-size:13px;
  font-weight:800;
  color:var(--text-primary);
}
.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.btn{
  border:0;
  border-radius:var(--radius-sm);
  padding:9px;
  background:#18221f;
  color:var(--text-primary);
  font-size:11.5px;
  font-weight:750;
  cursor:pointer;
  transition:all .2s ease;
}
.btn:hover{background:#23302b}
.btn.is-active{
  background:rgba(0,230,153,0.15);
  border:1px solid rgba(0,230,153,0.4);
  color:var(--mint);
}
#diagnosticsBox{
  display:none;
  background:#090d0c;
  border:1px solid #202b28;
  border-radius:10px;
  padding:8px;
  font-size:10px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:pre-wrap;
  word-break:break-all;
  max-height:120px;
  overflow-y:auto;
  color:#94a3b8;
}

/* ========================================================
   ★ 세로 모드 (PORTRAIT) - 단일 그리드 정렬
   ======================================================== */
@media (orientation: portrait) {
  .dashboard-grid{
    grid-template-areas:
      "cluster cluster"
      "boost   boost"
      "coolant oil"
      "batt    load";
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:clamp(5px, 0.9vh, 7px);
  }
  .main-cluster{ grid-area: cluster; }
  .card-boost  { grid-area: boost; min-height:clamp(46px, 7vh, 58px); }
  .card-coolant{ grid-area: coolant; min-height:clamp(48px, 7.5vh, 62px); }
  .card-oil    { grid-area: oil; min-height:clamp(48px, 7.5vh, 62px); }
  .card-batt   { grid-area: batt; min-height:clamp(48px, 7.5vh, 62px); }
  .card-load   { grid-area: load; min-height:clamp(48px, 7.5vh, 62px); }
}

/* ========================================================
   ★ 가로 모드 (LANDSCAPE) - 3열 와이드 날개 정렬
   ======================================================== */
@media (orientation: landscape) {
  .app{
    padding:clamp(4px, 1.4vh, 10px) clamp(10px, 2.5vw, 20px);
    gap:clamp(4px, 1vh, 8px);
  }
  header{
    min-height:22px;
  }
  .dashboard-grid{
    grid-template-areas:
      "coolant cluster boost"
      "oil     cluster batt";
    grid-template-columns:1fr 1.6fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:clamp(6px, 1.5vh, 10px) clamp(10px, 2vw, 16px);
    align-items:stretch;
  }
  .main-cluster{ grid-area: cluster; height:100%; }
  .card-coolant{ grid-area: coolant; }
  .card-oil    { grid-area: oil; }
  .card-boost  { grid-area: boost; }
  .card-batt   { grid-area: batt; }
  .card-load   { display: none; } /* 가로 시안: 4개 보조카드만 양 날개에 2x2 배치 */

  /* 가로 모드 중앙 아크 내부로 속도/RPM 통합 */
  .rpm-svg{
    max-height:clamp(100px, 38vh, 155px);
  }
  .rpm-center-box{
    display:none; /* 세로 전용 숨김 */
  }
  .speed-cluster{
    display:none; /* 세로 전용 숨김 */
  }
  .landscape-center-box{
    display:flex; /* 가로 전용 표시 */
  }

  /* 가로 모드 하단 컨트롤 바 슬림화 (가로 1줄로 납작하게) */
  .bottom-controls{
    flex-direction:row;
    gap:8px;
  }
  .bottom-controls .main-action-btn{
    flex:1.4;
    padding:6px 12px;
    font-size:11px;
  }
  .bottom-sub-btns{
    flex:1;
    gap:6px;
  }
  .bottom-sub-btns .sub-btn{
    padding:6px 8px;
    font-size:10px;
  }
}
</style>
</head>
<body>

<main class="app" id="appMain">
  <!-- 1. 상단 미니멀 헤더 -->
  <header>
    <div class="brand-group">
      <span class="brand-title">OBD // DASH</span>
      <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">DISCONNECTED</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openSettingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.09-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </header>

  <!-- 2. 대시보드 코어 그리드 (세로/가로 단일 DOM 자동 재정렬) -->
  <div class="dashboard-grid">
    
    <!-- [메인 클러스터] RPM 아크 + 속도계 -->
    <section class="main-cluster">
      <div class="rpm-arc-box">
        <svg class="rpm-svg" viewBox="0 18 200 96" aria-label="RPM Gauge">
          <!-- 숫자와 두꺼운 링을 제거한 미니멀 눈금. 끝부분은 레드존 -->

        <!-- [세로 모드] 아크 내부 RPM 수치 -->

      <!-- [세로 모드] 아크 아래 초대형 속도계 -->

    <!-- [BOOST 카드] 세로: 가로 막대바 / 가로: 우측 날개 카드 -->

  <!-- 3. OBD 데이터 기반 앰비언트 비주얼라이저 -->

  <!-- 4. 미연결 시 표시되는 하단 기본 컨트롤 바 (연결 시 자동 숨김) -->

      CONNECT OBD-II
    </button>

<!-- 설정 & 제어 모달/드로어 -->
<div class="modal-backdrop" id="settingsModal">

<script>
(() => {
const $ = id => document.getElementById(id);

// --- 1. OBD 데이터 기반 앰비언트 비주얼라이저 ---
const vizBox = $('visualizerBox');
const vizCanvas = $('vizCanvas');
const vizCtx = vizCanvas.getContext('2d',{alpha:false});
let currentIntensity = 0.35;
let liveRpm = 0, liveSpeed = 0, liveCoolant = null;
let liveOilTemp = null, liveLoad = null, liveVoltage = null, liveBoost = null;
let ambientParticles = [], ambientPhase = 0, ambientLast = 0, ambientFrame = 0;
const telemetryChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('essenza-obd-telemetry') : null;
function publishTelemetry(){
  const packet = {
    source:'essenza-obd', timestamp:Date.now(),
    connected:!!connected,
    rpm:liveRpm, speed:liveSpeed, coolant:liveCoolant,
    oilTemp:liveOilTemp, load:liveLoad, voltage:liveVoltage, boost:liveBoost
  };
  try { localStorage.setItem('essenza-obd-telemetry', JSON.stringify(packet)); } catch(e) {}
  if(telemetryChannel) telemetryChannel.postMessage(packet);
}

function resizeVisualizer(){
  const rect=vizCanvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  vizCanvas.width=Math.max(1,Math.round(rect.width*dpr));
  vizCanvas.height=Math.max(1,Math.round(rect.height*dpr));
  vizCtx.setTransform(dpr,0,0,dpr,0,0);
  const w=rect.width,h=rect.height;
  const n=Math.max(110,Math.min(520,Math.round(w*h/1150)));
  ambientParticles=Array.from({length:n},()=>({u:Math.random(),v:Math.random(),z:.25+Math.random()*.95,seed:Math.random()*Math.PI*2,size:.35+Math.random()*1.35}));
}
window.addEventListener('resize',resizeVisualizer);
document.addEventListener('fullscreenchange',()=>{
  document.body.classList.toggle('ambient-fullscreen',document.fullscreenElement===vizBox);
  setTimeout(resizeVisualizer,100);
});
window.addEventListener('orientationchange',()=>setTimeout(resizeVisualizer,180));
resizeVisualizer();

function updateAmbientClock(){
  const d=new Date();
  $('ambientTime').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('ambientDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase().replace(',',' ·');
}
updateAmbientClock();setInterval(updateAmbientClock,1000);

function drawVisualizer(t){
  const w=vizCanvas.clientWidth,h=vizCanvas.clientHeight;
  if(!w||!h){ambientFrame=requestAnimationFrame(drawVisualizer);return;}
  const dt=Math.min((t-ambientLast)/1000||0,.04);ambientLast=t;
  const rpmFactor=Math.max(0,Math.min(1,liveRpm/4200));
  const loadFactor=liveLoad==null?0:Math.max(0,Math.min(1,liveLoad/100));
  const thermal=liveCoolant==null?liveOilTemp:liveCoolant;
  const heat=thermal==null?0:Math.max(0,Math.min(1,(thermal-55)/55));
  ambientPhase+=dt*(.34+rpmFactor*1.15+loadFactor*.55);
  $('ambientSpeed').textContent=Math.round(liveSpeed).toString();
  $('ambientRpm').textContent=Math.round(liveRpm).toLocaleString('en-US');

  // Coolant temperature gradually shifts the energy field from cool teal to warm amber.
  const red=Math.round(35+heat*185), green=Math.round(155-heat*35), blue=Math.round(112-heat*95);
  vizCtx.fillStyle='rgba(2,8,7,.25)';vizCtx.fillRect(0,0,w,h);
  const cx=w*.5,cy=h*.52,amp=h*(.075+rpmFactor*.085+loadFactor*.045),flow=.12+rpmFactor*.55+loadFactor*.32;
  for(let band=0;band<5;band++){
    vizCtx.beginPath();
    for(let x=0;x<=w+8;x+=Math.max(4,w/130)){
      const nx=x/w,env=Math.sin(Math.PI*nx);
      const y=cy+(band-2)*amp*.22+Math.sin(nx*8.5+ambientPhase*(.7+band*.08)+band)*amp*env*.58+Math.sin(nx*19-ambientPhase*.34+band*1.7)*amp*.12;
      if(x===0)vizCtx.moveTo(x,y);else vizCtx.lineTo(x,y);
    }
    vizCtx.strokeStyle='rgba('+red+','+green+','+blue+','+(.055+band*.012+rpmFactor*.025)+')';
    vizCtx.lineWidth=1+band*.65;vizCtx.shadowBlur=12+rpmFactor*20;
    vizCtx.shadowColor='rgba('+red+','+green+','+blue+',.28)';vizCtx.stroke();
  }
  vizCtx.shadowBlur=0;
  for(const p of ambientParticles){
    p.u+=dt*flow*(.012+p.z*.035);
    if(p.u>1.08){p.u=-.08;p.v=Math.random();}
    const nx=p.u,x=nx*w,env=Math.sin(Math.PI*nx);
    const center=cy+Math.sin(nx*8.5+ambientPhase)*amp*env*.58;
    const y=center+(p.v-.5)*h*(.18+p.z*.42)+Math.sin(nx*19-ambientPhase*.34+p.seed)*amp*.12;
    const twinkle=.55+.45*Math.sin(ambientPhase*1.6+p.seed),r=p.size*p.z*(.7+rpmFactor*.18);
    vizCtx.beginPath();vizCtx.arc(x,y,Math.max(.35,r),0,Math.PI*2);
    vizCtx.fillStyle='rgba('+red+','+(green+Math.round(twinkle*45))+','+(blue+Math.round(twinkle*38))+','+(.18+p.z*.62)*twinkle+')';
    vizCtx.shadowBlur=3+p.z*12;vizCtx.shadowColor='rgba('+red+','+green+','+blue+',.7)';vizCtx.fill();
    if(p.z>.78&&twinkle>.92){vizCtx.beginPath();vizCtx.moveTo(x-r*4,y);vizCtx.lineTo(x+r*4,y);vizCtx.strokeStyle='rgba(190,255,220,.22)';vizCtx.lineWidth=.6;vizCtx.stroke();}
  }
  vizCtx.shadowBlur=0;
  const glow=vizCtx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.62);
  glow.addColorStop(0,'rgba('+red+','+green+','+blue+',.12)');glow.addColorStop(.48,'rgba(4,44,30,.07)');glow.addColorStop(1,'rgba(0,0,0,0)');
  vizCtx.fillStyle=glow;vizCtx.fillRect(0,0,w,h);
  ambientFrame=requestAnimationFrame(drawVisualizer);
}
vizCtx.fillStyle='#030908';vizCtx.fillRect(0,0,vizCanvas.width,vizCanvas.height);
ambientFrame=requestAnimationFrame(drawVisualizer);

async function toggleAmbientFullscreen(){
  try{
    if(document.fullscreenElement===vizBox){
      await document.exitFullscreen();
      return;
    }
    // The dashboard itself may already be fullscreen after OBD connection.
    // In that case expand the visualizer with a CSS overlay instead of
    // requesting a second, nested fullscreen transition.
    if(document.fullscreenElement){
      document.body.classList.toggle('ambient-expanded');
      setTimeout(resizeVisualizer,100);
      return;
    }
    if(vizBox.requestFullscreen)await vizBox.requestFullscreen();
    else document.body.classList.toggle('ambient-expanded');
    setTimeout(resizeVisualizer,100);
  }catch(e){log('Ambient fullscreen: '+e.message);}
}
vizBox.addEventListener('click',toggleAmbientFullscreen);
vizBox.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleAmbientFullscreen();}});

// --- 2. RPM 아크 게이지 업데이트 ---
function updateRpm(rpm, maxRpm = 8000) {
  const rVal = Math.max(0, Math.min(maxRpm, Math.round(rpm || 0)));
  liveRpm = rVal;
  publishTelemetry();
  $('rpmVal').textContent = rVal.toLocaleString('en-US');
  $('rpmValL').textContent = rVal.toLocaleString('en-US');
  // RPM은 중앙 숫자로 표시하고, 반원은 고정 눈금만 유지합니다.
  currentIntensity = Math.min(1.0, 0.3 + (rVal / maxRpm) * 0.7);
}

// --- 3. 속도 업데이트 ---
function updateSpeed(spd) {
  const sVal = spd === null ? 0 : Math.round(spd);
  liveSpeed = sVal;
  publishTelemetry();
  $('speedVal').textContent = sVal;
  $('speedValL').textContent = sVal;
}

// --- 4. 부스트 업데이트 ---
function updateBoost(boost) {
  liveBoost = boost;
  publishTelemetry();
  const bVal = boost === null ? 0 : Math.max(0, boost);
  const text = bVal.toFixed(2);
  $('boostVal').textContent = text;

  const ratio = Math.max(0, Math.min(1, bVal / 2.0));
  $('boostFill').style.width = (ratio * 100).toFixed(1) + '%';
}

// --- 5. 보조 지표 업데이트 (단일 DOM 업데이트) ---
function updateCoolant(temp) {
  liveCoolant = (temp === null || temp === undefined) ? null : temp;
  publishTelemetry();
  const text = (temp === null || temp === undefined) ? '--' : Math.round(temp);
  $('valCoolant').textContent = text;

  const card = $('cardCoolant');
  if (!card) return;
  card.className = 'stat-card card-coolant';
  if (temp !== null && temp !== undefined) {
    if (temp < 60) card.classList.add('state-cold');
    else if (temp >= 108) card.classList.add('state-danger');
    else if (temp >= 100) card.classList.add('state-warn');
  }
}

function updateOilTemp(temp) {
  liveOilTemp = (temp === null || temp === undefined) ? null : temp;
  publishTelemetry();
  const text = (temp === null || temp === undefined) ? '--' : Math.round(temp);
  $('valOil').textContent = text;

  const card = $('cardOil');
  if (!card) return;
  card.className = 'stat-card card-oil';
  if (temp !== null && temp !== undefined) {
    if (temp >= 125) card.classList.add('state-danger');
    else if (temp >= 115) card.classList.add('state-warn');
  }
}

function updateBattery(volts) {
  liveVoltage = (volts === null || volts === undefined) ? null : volts;
  publishTelemetry();
  const text = (volts === null || volts === undefined) ? '--.-' : volts.toFixed(1);
  $('valVoltage').textContent = text;

  const card = $('cardVoltage');
  if (!card) return;
  card.className = 'stat-card card-batt';
  if (volts !== null && volts !== undefined) {
    if (volts < 12.0) card.classList.add('state-danger');
    else if (volts < 12.5) card.classList.add('state-warn');
    else if (volts > 15.0) card.classList.add('state-danger');
  }
}

function updateEngineLoad(load) {
  liveLoad = (load === null || load === undefined) ? null : load;
  publishTelemetry();
  const text = (load === null || load === undefined) ? '--' : Math.round(load);
  $('valLoad').textContent = text;

  const card = $('cardLoad');
  if (!card) return;
  card.className = 'stat-card card-load';
  if (load !== null && load !== undefined && load >= 85) {
    card.classList.add('state-warn');
  }
}

// --- 6. BLE OBD-II 통신 및 상태 관리 ---
const UUIDS = [
  {name:"ELM BLE FFF0",service:"0000fff0-0000-1000-8000-00805f9b34fb",notify:"0000fff1-0000-1000-8000-00805f9b34fb",write:"0000fff2-0000-1000-8000-00805f9b34fb"},
  {name:"ELM BLE FFE0",service:"0000ffe0-0000-1000-8000-00805f9b34fb",notify:"0000ffe1-0000-1000-8000-00805f9b34fb",write:"0000ffe1-0000-1000-8000-00805f9b34fb"},
  {name:"NORDIC UART",service:"6e400001-b5a3-f393-e0a9-e50e24dcca9e",notify:"6e400003-b5a3-f393-e0a9-e50e24dcca9e",write:"6e400002-b5a3-f393-e0a9-e50e24dcca9e"},
  {name:"CUSTOM 18F0",service:"000018f0-0000-1000-8000-00805f9b34fb",notify:"00002af0-0000-1000-8000-00805f9b34fb",write:"00002af1-0000-1000-8000-00805f9b34fb"}
];
const optionalServices = [...new Set([...UUIDS.map(x=>x.service),"0000180a-0000-1000-8000-00805f9b34fb"])];

let device = null, server = null, rx = null, tx = null;
let notifyBuffer = "", pending = null, connected = false, polling = false;
let wakeLock = null, logLines = [];
let supported = {};

const log = s => {
  logLines.unshift(new Date().toLocaleTimeString() + " " + s);
  logLines = logLines.slice(0, 30);
  $('diagnosticsBox').textContent = logLines.join("\n");
};

function setUIConnectedState(mode) {
  const pill = $('statusPill');
  const txt = $('statusText');
  const disBtn = $('disconnectBtn');
  const connBtn = $('connectBtn');

  if (mode === 'connected') {
    document.body.classList.add('is-connected');
    pill.className = 'status-pill connected';
    txt.textContent = 'CONNECTED';
    disBtn.disabled = false;
    connBtn.disabled = true;
  } else if (mode === 'demo') {
    document.body.classList.add('is-connected');
    pill.className = 'status-pill demo';
    txt.textContent = 'DEMO MODE';
    disBtn.disabled = false;
    connBtn.disabled = true;
  } else {
    document.body.classList.remove('is-connected');
    pill.className = 'status-pill';
    txt.textContent = 'DISCONNECTED';
    disBtn.disabled = true;
    connBtn.disabled = false;
  }
  publishTelemetry();
}

const delay = ms => new Promise(r => setTimeout(r, ms));

function onNotify(e) {
  notifyBuffer += new TextDecoder().decode(e.target.value);
  if (notifyBuffer.includes(">") && pending) {
    const p = pending;
    pending = null;
    const out = notifyBuffer;
    notifyBuffer = "";
    p(out);
  }
}

async function raw(cmd, timeout = 1400) {
  if (!tx) throw Error("BLE write characteristic unavailable");
  if (pending) throw Error("Previous OBD command still pending");
  return new Promise(async (resolve, reject) => {
    pending = resolve;
    notifyBuffer = "";
    const timer = setTimeout(() => {
      if (pending) {
        const p = pending;
        pending = null;
        p(notifyBuffer || "TIMEOUT");
      }
    }, timeout);
    try {
      const data = new TextEncoder().encode(cmd + "\r");
      if (tx.properties.writeWithoutResponse && !tx.properties.write) {
        await tx.writeValueWithoutResponse(data);
      } else {
        await tx.writeValue(data);
      }
      const original = pending;
      pending = s => { clearTimeout(timer); original(s); };
    } catch (e) {
      clearTimeout(timer);
      pending = null;
      reject(e);
    }
  });
}

async function cmd(c) {
  const r = await raw(c);
  log(">" + c + "  " + r.replace(/[\r\n]/g, " ").trim());
  return r;
}

async function findProfile(gatt) {
  for (const p of UUIDS) {
    try {
      const svc = await gatt.getPrimaryService(p.service);
      const n = await svc.getCharacteristic(p.notify);
      let w;
      try { w = await svc.getCharacteristic(p.write); } catch (e) { w = n; }
      if (!(n.properties.notify || n.properties.indicate)) continue;
      if (!(w.properties.write || w.properties.writeWithoutResponse)) continue;
      rx = n; tx = w;
      log("GATT profile: " + p.name);
      return true;
    } catch (e) {}
  }
  for (const sid of optionalServices) {
    try {
      const svc = await gatt.getPrimaryService(sid);
      const chars = await svc.getCharacteristics();
      const n = chars.find(c => c.properties.notify || c.properties.indicate);
      const w = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if (n && w) {
        rx = n; tx = w;
        log("GATT custom profile: " + sid);
        return true;
      }
    } catch (e) {}
  }
  return false;
}

function bytesFor(resp, pid) {
  const clean = resp.replace(/SEARCHING\.\.\./gi, "").replace(/[^0-9a-f]/gi, "").toUpperCase();
  const key = ("41" + pid).toUpperCase();
  const i = clean.indexOf(key);
  if (i < 0) return null;
  const pairs = clean.slice(i + key.length).match(/.{2}/g) || [];
  return pairs.map(x => parseInt(x, 16)).filter(Number.isFinite);
}

async function pid(pidCode, n, fn) {
  const r = await cmd("01" + pidCode);
  const b = bytesFor(r, pidCode);
  if (!b || b.length < n) {
    supported[pidCode] = false;
    return null;
  }
  supported[pidCode] = true;
  return fn(...b);
}

async function readVoltage() {
  const r = await cmd("ATRV");
  const m = r.match(/(\d+(?:\.\d+)?)\s*V/i);
  return m ? Number(m[1]) : null;
}

// 실시간 폴링 루프
async function poll() {
  if (polling) return;
  polling = true;
  let slowIndex = 0;
  let mapVal = null, baroVal = null;

  const slowTasks = [
    async () => {
      const v = await pid("05", 1, a => a - 40);
      updateCoolant(v);
    },
    async () => {
      const v = await pid("5C", 1, a => a - 40);
      updateOilTemp(v);
    },
    async () => {
      const v = await pid("0B", 1, a => a);
      return v;
    },
    async () => {
      const v = await pid("33", 1, a => a);
      return v;
    },
    async () => {
      const v = await pid("04", 1, a => Math.round(a * 100 / 255));
      updateEngineLoad(v);
    },
    async () => {
      const v = await readVoltage();
      updateBattery(v);
    }
  ];

  try {
    while (connected) {
      const speed = await pid("0D", 1, a => a);
      if (speed !== null) updateSpeed(speed);

      const rpm = await pid("0C", 2, (a, b) => Math.round((a * 256 + b) / 4));
      if (rpm !== null) updateRpm(rpm);

      try {
        const t = slowTasks[slowIndex]();
        slowIndex = (slowIndex + 1) % slowTasks.length;
        const res = await t;
        if (slowIndex === 3) mapVal = res;
        if (slowIndex === 4) baroVal = res;
        if (mapVal !== null && baroVal !== null) {
          const boost = Math.max(0, (mapVal - baroVal) / 100);
          updateBoost(boost);
        }
      } catch (err) {
        log("PID sub: " + err.message);
      }

      await delay(90);
    }
  } catch (e) {
    log("Polling stopped: " + e.message);
  }
  polling = false;
}

let bleConnectionStarting = false;

async function startBLE() {
  if (demoActive) stopDemo();
  if (!navigator.bluetooth) {
    alert("이 브라우저는 Web Bluetooth를 지원하지 않습니다. Chrome/Android 환경에서 이용하세요.");
    return;
  }
  // Android Chrome treats fullscreen and the Bluetooth chooser as
  // separate user-activation actions. Run them in two deliberate taps:
  // tap 1 enters fullscreen; tap 2 opens the Bluetooth chooser.
  if (bleConnectionStarting || connected) return;
  if (autoRoutine && !document.fullscreenElement) {
    bleConnectionStarting = true;
    $('connectBtn').disabled = true;
    requestFullscreenSafe().finally(() => {
      bleConnectionStarting = false;
      $('connectBtn').disabled = false;
      $('statusText').textContent = 'DISCONNECTED';
    });
    return;
  }

  bleConnectionStarting = true;
  $('connectBtn').disabled = true;
  $('statusText').textContent = 'SEARCHING...';
  try {
    // Do not request fullscreen again here. The chooser gets the full
    // user gesture, and canceling it must not exit fullscreen.
    const deviceRequest = navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices
    });
    device = await deviceRequest;
    if (autoRoutine) await enableWakeLock();
    log("Device: " + (device.name || "Unnamed"));
    device.addEventListener("gattserverdisconnected", () => {
      connected = false;
      setUIConnectedState('disconnected');
      log("GATT disconnected");
      disableWakeLock();
      exitFullscreenSafe();
    });

    server = await device.gatt.connect();
    if (!await findProfile(server)) throw Error("호환 BLE 프로파일을 찾지 못했습니다.");
    await rx.startNotifications();
    rx.addEventListener("characteristicvaluechanged", onNotify);
    connected = true;

    for (const c of ["ATZ","ATE0","ATL0","ATS0","ATH0","ATSP0"]) {
      await cmd(c);
      await delay(100);
    }
    setUIConnectedState('connected');
    bleConnectionStarting = false;

    poll();
  } catch (err) {
    bleConnectionStarting = false;
    log("BLE Err: " + err.message);
    setUIConnectedState('disconnected');
    if (device?.gatt?.connected) device.gatt.disconnect();
    disableWakeLock();
    // Keep fullscreen active after chooser cancellation or connection error.
    // The user can retry without another fullscreen transition.
  }
}

function disconnectBLE() {
  connected = false;
  if (device?.gatt?.connected) device.gatt.disconnect();
  setUIConnectedState('disconnected');
  disableWakeLock();
  exitFullscreenSafe();
}

// --- 7. DEMO 모드 (시뮬레이터) ---
let demoActive = false;
let demoTimer = null;
let demoPhase = 0;

function startDemo() {
  if (connected) disconnectBLE();
  demoActive = true;
  setUIConnectedState('demo');
  $('modalDemoBtn').textContent = 'DEMO MODE: ON';
  $('modalDemoBtn').classList.add('is-active');

  let currentSpeed = 0;
  let currentRpm = 850;
  let targetSpeed = 0;
  let gear = 1;
  let coolantSim = 54;
  let oilSim = 95;
  let voltSim = 12.3;

  demoTimer = setInterval(() => {
    demoPhase += 0.05;

    const cycle = Math.sin(demoPhase * 0.4);
    if (cycle > 0) {
      targetSpeed = 40 + cycle * 125;
    } else {
      targetSpeed = 20 + Math.abs(cycle) * 35;
    }
    currentSpeed += (targetSpeed - currentSpeed) * 0.08;

    if (currentSpeed < 30) {
      gear = 1;
      currentRpm = 1000 + currentSpeed * 90;
    } else if (currentSpeed < 65) {
      gear = 2;
      currentRpm = 1800 + (currentSpeed - 30) * 80;
    } else if (currentSpeed < 105) {
      gear = 3;
      currentRpm = 2200 + (currentSpeed - 65) * 75;
    } else {
      gear = 4;
      currentRpm = 2800 + (currentSpeed - 105) * 60;
    }
    if (cycle > 0.8) currentRpm = Math.min(7600, currentRpm + 1800);

    const boostSim = Math.max(0, (currentRpm > 3000 ? (currentRpm - 2500) / 3800 : 0.1) * (cycle > 0 ? 1.25 : 0.2));

    coolantSim += 0.08;
    if (coolantSim > 105) coolantSim = 88;

    oilSim = coolantSim + 33; // 121도 점등 시뮬레이션
    if (oilSim > 130) oilSim = 98;

    voltSim = 13.8 + Math.sin(demoPhase) * 0.3;
    const loadSim = Math.min(96, Math.max(18, (currentRpm / 7500) * 100));

    updateSpeed(currentSpeed);
    updateRpm(currentRpm);
    updateBoost(boostSim);
    updateCoolant(coolantSim);
    updateOilTemp(oilSim);
    updateBattery(voltSim);
    updateEngineLoad(loadSim);
  }, 60);
}

function stopDemo() {
  demoActive = false;
  if (demoTimer) clearInterval(demoTimer);
  demoTimer = null;
  setUIConnectedState('disconnected');
  $('modalDemoBtn').textContent = 'DEMO MODE: OFF';
  $('modalDemoBtn').classList.remove('is-active');

  updateSpeed(0);
  updateRpm(0);
  updateBoost(0);
  updateCoolant(null);
  updateOilTemp(null);
  updateBattery(null);
  updateEngineLoad(null);
}

// --- 8. 화면 유지(WakeLock) & 풀스크린 & 제어 루틴 ---
let autoRoutine = localStorage.getItem('obd_auto_routine') !== 'false';

function updateAutoRoutineButton() {
  const btn = $('autoRoutineBtn');
  if (!btn) return;
  btn.textContent = `AUTO FULLSCREEN & WAKE: ${autoRoutine ? 'ON' : 'OFF'}`;
  btn.classList.toggle('is-active', autoRoutine);
}
updateAutoRoutineButton();

function updateFullscreenButtons(isActive) {
  const text = isActive ? 'EXIT FULLSCREEN' : 'FULL SCREEN';
  if ($('fullscreenBtn')) {
    $('fullscreenBtn').textContent = text;
    $('fullscreenBtn').classList.toggle('is-active', isActive);
  }
  if ($('quickFullscreenBtn')) {
    $('quickFullscreenBtn').textContent = text;
    $('quickFullscreenBtn').classList.toggle('is-active', isActive);
  }
}

function updateWakeButtons(isActive) {
  const text = isActive ? 'SCREEN ON ✓' : 'KEEP SCREEN ON';
  if ($('wakeLockBtn')) {
    $('wakeLockBtn').textContent = text;
    $('wakeLockBtn').classList.toggle('is-active', isActive);
  }
  if ($('quickWakeBtn')) {
    $('quickWakeBtn').textContent = text;
    $('quickWakeBtn').classList.toggle('is-active', isActive);
  }
}

async function enableWakeLock() {
  if (wakeLock) return true;
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      updateWakeButtons(true);
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        updateWakeButtons(false);
      });
      return true;
    }
  } catch (e) {
    log("WakeLock Err: " + e.message);
  }
  return false;
}

async function disableWakeLock() {
  if (wakeLock) {
    try { await wakeLock.release(); } catch (e) {}
    wakeLock = null;
    updateWakeButtons(false);
  }
}

async function requestFullscreenSafe() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
    updateFullscreenButtons(true);
  } catch (e) {
    log("Auto Fullscreen: " + e.message);
  }
}

async function exitFullscreenSafe() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }
  } catch (e) {}
  updateFullscreenButtons(false);
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    log("Fullscreen Err: " + e.message);
  }
}

async function toggleWakeLock() {
  if (wakeLock) {
    await disableWakeLock();
  } else {
    await enableWakeLock();
  }
}

document.addEventListener('fullscreenchange', () => {
  updateFullscreenButtons(!!document.fullscreenElement);
});

// --- 9. 이벤트 바인딩 ---
$('connectBtn').onclick = startBLE;
$('disconnectBtn').onclick = () => {
  if (demoActive) stopDemo();
  else disconnectBLE();
  $('settingsModal').classList.remove('open');
};

$('autoRoutineBtn').onclick = () => {
  autoRoutine = !autoRoutine;
  localStorage.setItem('obd_auto_routine', autoRoutine);
  updateAutoRoutineButton();
};

$('modalDemoBtn').onclick = () => {
  if (demoActive) stopDemo();
  else startDemo();
};

$('quickFullscreenBtn').onclick = toggleFullscreen;
$('quickWakeBtn').onclick = toggleWakeLock;
$('fullscreenBtn').onclick = toggleFullscreen;
$('wakeLockBtn').onclick = toggleWakeLock;

$('openSettingsBtn').onclick = () => $('settingsModal').classList.add('open');
$('closeSettingsBtn').onclick = () => $('settingsModal').classList.remove('open');
$('settingsModal').onclick = e => {
  if (e.target === $('settingsModal')) $('settingsModal').classList.remove('open');
};

$('toggleLogBtn').onclick = () => {
  const box = $('diagnosticsBox');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
};

// PWA Service Worker
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update();
    }).catch(e => log("SW Err: " + e.message));

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}
})();

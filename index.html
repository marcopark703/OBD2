<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d0c">
<meta name="description" content="범용 BLE OBD-II 실시간 차량 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<title>OBD Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#090d0c;--panel:#191f1e;--panel2:#121817;--red:#ff3038;--red2:#d9232d;--white:#f5f7f6;--muted:#a9b1ae;--track:#424b48;--green:#00c900;--pad:clamp(10px,2.5vw,18px);--radius:clamp(12px,2vw,17px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,Roboto,"Noto Sans KR",system-ui,sans-serif}
body{padding:clamp(5px,1vw,10px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.app{width:100%;max-width:980px;margin:0 auto;background:#0b100f;border-radius:22px;padding:var(--pad);min-height:calc(100dvh - 10px);display:flex;flex-direction:column;gap:clamp(9px,1.8vw,14px)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{min-width:0}.make{font-size:clamp(10px,1.7vw,13px);font-weight:900;color:var(--red);letter-spacing:-.2px}
.model{font-size:clamp(23px,4vw,31px);font-weight:850;letter-spacing:-1px;line-height:1.15;margin-top:4px}
.conn{font-size:clamp(10px,1.6vw,12px);font-weight:700;color:var(--green);background:#062008;padding:5px 9px;border-radius:99px;white-space:nowrap}
.conn.off{color:#c0c6c3;background:#202725}
.mainrow{display:grid;grid-template-columns:minmax(0,2.45fr) minmax(0,1fr);gap:9px}
.card{background:var(--panel);border-radius:var(--radius);padding:clamp(10px,2vw,14px);min-width:0}
.kicker{font-size:clamp(10px,1.6vw,12px);color:var(--muted);font-weight:450}
.speedval{font-size:clamp(64px,13.5vw,94px);font-weight:950;letter-spacing:-4px;line-height:.98;font-variant-numeric:tabular-nums}
.rpmval{font-size:clamp(25px,5.4vw,36px);font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:13px}
.unit{color:var(--red);font-size:clamp(11px,1.8vw,13px);font-weight:700}
.track{height:4px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:0;background:var(--red);border-radius:9px;transition:width .22s linear}
.section{font-size:clamp(11px,1.8vw,13px);font-weight:850;color:var(--red);margin-top:0}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.gaugecard{padding:clamp(8px,1.6vw,11px);display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(150px,27vw,202px)}
.gauge-title{font-size:clamp(9px,1.4vw,11px);color:var(--muted)}
.gauge{width:100%;height:auto;display:block;margin:3px auto 0;overflow:visible}
.gauge-value{font-size:clamp(25px,5vw,34px);font-weight:950;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.gauge-unit{font-size:clamp(10px,1.5vw,12px);font-weight:750}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bottom .value{font-size:clamp(20px,4vw,26px);font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:5px}
.footer{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#77817d;font-size:9px;margin-top:auto}
.controls{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:9px 12px;background:#252e2b;color:#f5f7f6;font-size:12px;font-weight:750}
button.primary{background:var(--red);color:white}button:disabled{opacity:.4}
#diagnostics{display:none;background:#111817;border:1px solid #303a36;border-radius:12px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;color:#c5ceca}
/* Narrow phones / Galaxy Fold cover screen / Mobile layout */
@media(max-width:768px){
 .app{min-height:calc(100dvh - 10px);gap:clamp(12px,2.2vh,20px);padding:clamp(12px,3vw,17px)}
 .mainrow{grid-template-columns:minmax(0,1fr);gap:10px}
 .mainrow>.card:first-child{padding:clamp(14px,3.8vw,20px)}
 .speedval{font-size:clamp(76px,19vw,116px);letter-spacing:-5px}
 .rpmval{font-size:clamp(34px,8vw,48px);margin-top:7px}
 .mainrow>.card:nth-child(2){display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
 .mainrow>.card:nth-child(2) .kicker{grid-column:1}
 .mainrow>.card:nth-child(2) .rpmval{grid-column:2;grid-row:1/3;margin:0}
 .mainrow>.card:nth-child(2) .unit{grid-column:1;grid-row:2}
 .mainrow>.card:nth-child(2) .track{grid-column:1/-1}
 .gauges{gap:8px}
 .gaugecard{min-height:clamp(174px,23vh,220px);padding:clamp(10px,2.6vw,15px)}
 .gauge{max-height:clamp(95px,14vh,135px)}
 .gauge-value{font-size:clamp(27px,7vw,38px)}
 .bottom .card{padding:clamp(13px,3vw,18px);min-height:clamp(82px,11vh,108px)}
 .bottom .value{font-size:clamp(23px,6vw,32px)}
 .controls{gap:6px}
 .controls button{padding:8px 10px;font-size:11px}
 .footer{font-size:8px}
}
@media(max-width:370px){.gauges{gap:6px}.gaugecard{min-height:165px}.gauge-title{font-size:8px}}
@media(orientation:landscape) and (max-height:520px){.app{max-width:1100px;min-height:auto}.gauges{grid-template-columns:repeat(3,minmax(0,1fr))}.gaugecard{min-height:125px}.speedval{font-size:clamp(48px,8vw,70px)}.gauge{max-height:78px}}
@media(min-width:769px){.app{padding:18px}.gaugecard{min-height:190px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="brand"><div class="make" id="make">VEHICLE</div><div class="model" id="model">OBD DASHBOARD</div></div>
 <div class="conn off" id="connection">DISCONNECTED</div>
</header>

<section class="mainrow">
 <div class="card">
  <div class="kicker">SPEED</div>
  <div class="speedval" id="speed">--</div>
  <div class="unit">km/h</div>
  <div class="track"><div class="fill" id="speedbar"></div></div>
 </div>
 <div class="card">
  <div class="kicker">ENGINE RPM</div>
  <div class="rpmval" id="rpm">----</div>
  <div class="unit">rpm</div>
  <div class="track"><div class="fill" id="rpmbar"></div></div>
 </div>
</section>

<div class="section">ENGINE CONDITION</div>
<section class="gauges">
 <div class="card gaugecard">
  <div class="gauge-title">COOLANT</div>
  <svg class="gauge" viewBox="0 0 200 128" aria-label="Coolant gauge">
   <path d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#424b48" stroke-width="15" stroke-linecap="round"/>
   <path id="coolantArc" d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#ff3038" stroke-width="15" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
   <path id="coolantNeedle" d="M100 108 L100 30" stroke="#f6f7f7" stroke-width="5" stroke-linecap="round" transform="rotate(-90 100 108)"/>
   <circle cx="100" cy="108" r="9" fill="#ff3038"/>
  </svg>
  <div><span class="gauge-value" id="coolant">--°</span><span class="gauge-unit"> C</span></div>
 </div>
 <div class="card gaugecard">
  <div class="gauge-title">OIL TEMP</div>
  <svg class="gauge" viewBox="0 0 200 128" aria-label="Oil temperature gauge">
   <path d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#424b48" stroke-width="15" stroke-linecap="round"/>
   <path id="oilArc" d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#ff3038" stroke-width="15" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
   <path id="oilNeedle" d="M100 108 L100 30" stroke="#f6f7f7" stroke-width="5" stroke-linecap="round" transform="rotate(-90 100 108)"/>
   <circle cx="100" cy="108" r="9" fill="#ff3038"/>
  </svg>
  <div><span class="gauge-value" id="oil">--°</span><span class="gauge-unit"> C</span></div>
 </div>
 <div class="card gaugecard">
  <div class="gauge-title">BOOST</div>
  <svg class="gauge" viewBox="0 0 200 128" aria-label="Boost gauge">
   <path d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#424b48" stroke-width="15" stroke-linecap="round"/>
   <path id="boostArc" d="M20 108 A80 80 0 0 1 180 108" fill="none" stroke="#ff3038" stroke-width="15" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
   <path id="boostNeedle" d="M100 108 L100 30" stroke="#f6f7f7" stroke-width="5" stroke-linecap="round" transform="rotate(-90 100 108)"/>
   <circle cx="100" cy="108" r="9" fill="#ff3038"/>
  </svg>
  <div><span class="gauge-value" id="boost">--</span><span class="gauge-unit"> bar</span></div>
 </div>
</section>

<section class="bottom">
 <div class="card"><div class="kicker">BATTERY</div><div class="value" id="voltage">--.- V</div></div>
 <div class="card"><div class="kicker">ENGINE LOAD</div><div class="value" id="load">--%</div></div>
</section>

<div class="controls">
 <button class="primary" id="connect">CONNECT OBD-II</button>
 <button id="fullscreen">FULL SCREEN</button>
 <button id="wake">KEEP SCREEN ON</button>
 <button id="settings">CONNECTION LOG</button>
 <button id="disconnect" disabled>DISCONNECT</button>
</div>
<pre id="diagnostics"></pre>
<footer class="footer"><span id="adapter">GENERIC BLE OBD-II · STANDARD PID</span><span id="lastUpdate">WAITING FOR DATA</span></footer>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const UUIDS=[
 {name:"ELM BLE FFF0",service:"0000fff0-0000-1000-8000-00805f9b34fb",notify:"0000fff1-0000-1000-8000-00805f9b34fb",write:"0000fff2-0000-1000-8000-00805f9b34fb"},
 {name:"ELM BLE FFE0",service:"0000ffe0-0000-1000-8000-00805f9b34fb",notify:"0000ffe1-0000-1000-8000-00805f9b34fb",write:"0000ffe1-0000-1000-8000-00805f9b34fb"},
 {name:"NORDIC UART",service:"6e400001-b5a3-f393-e0a9-e50e24dcca9e",notify:"6e400003-b5a3-f393-e0a9-e50e24dcca9e",write:"6e400002-b5a3-f393-e0a9-e50e24dcca9e"},
 {name:"CUSTOM 18F0",service:"000018f0-0000-1000-8000-00805f9b34fb",notify:"00002af0-0000-1000-8000-00805f9b34fb",write:"00002af1-0000-1000-8000-00805f9b34fb"}
];
const optionalServices=[...new Set([...UUIDS.map(x=>x.service),"0000180a-0000-1000-8000-00805f9b34fb"])];
let device=null,server=null,rx=null,tx=null,notifyBuffer="",pending=null,connected=false,polling=false,wakeLock=null,logLines=[];
let supported={};
const log=s=>{logLines.unshift(new Date().toLocaleTimeString()+" "+s);logLines=logLines.slice(0,24);$("diagnostics").textContent=logLines.join("\n")};
const setConn=(s,on=false)=>{$("connection").textContent=s;$("connection").classList.toggle("off",!on)};
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function onNotify(e){notifyBuffer+=new TextDecoder().decode(e.target.value);if(notifyBuffer.includes(">")&&pending){const p=pending;pending=null;const out=notifyBuffer;notifyBuffer="";p(out)}}
async function raw(cmd,timeout=1400){
 if(!tx)throw Error("BLE write characteristic unavailable");
 if(pending)throw Error("Previous OBD command still pending");
 return new Promise(async(resolve,reject)=>{
  pending=resolve;notifyBuffer="";
  const timer=setTimeout(()=>{if(pending){const p=pending;pending=null;p(notifyBuffer||"TIMEOUT")}},timeout);
  try{
   const data=new TextEncoder().encode(cmd+"\r");
   if(tx.properties.writeWithoutResponse && !tx.properties.write) await tx.writeValueWithoutResponse(data);
   else await tx.writeValue(data);
   const original=pending;pending=s=>{clearTimeout(timer);original(s)};
  }catch(e){clearTimeout(timer);pending=null;reject(e)}
 });
}
async function cmd(c){const r=await raw(c);log(">"+c+"  "+r.replace(/[\r\n]/g," ").trim());return r}
async function findProfile(gatt){
 for(const p of UUIDS){
  try{
   const svc=await gatt.getPrimaryService(p.service);
   const n=await svc.getCharacteristic(p.notify);
   let w;
   try{w=await svc.getCharacteristic(p.write)}catch(e){w=n}
   if(!(n.properties.notify||n.properties.indicate))continue;
   if(!(w.properties.write||w.properties.writeWithoutResponse))continue;
   rx=n;tx=w;log("GATT profile: "+p.name);$("adapter").textContent="BLE · "+p.name;return true;
  }catch(e){}
 }
 // Fallback: inspect known permitted services and infer notify/write characteristics.
 for(const sid of optionalServices){
  try{
   const svc=await gatt.getPrimaryService(sid);
   const chars=await svc.getCharacteristics();
   const n=chars.find(c=>c.properties.notify||c.properties.indicate);
   const w=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);
   if(n&&w){rx=n;tx=w;log("GATT custom profile: "+sid);$("adapter").textContent="BLE · CUSTOM GATT";return true}
  }catch(e){}
 }
 return false;
}
function bytesFor(resp,pid){
 const clean=resp.replace(/SEARCHING\.\.\./gi,"").replace(/[^0-9a-f]/gi,"").toUpperCase();
 const key=("41"+pid).toUpperCase(),i=clean.indexOf(key);if(i<0)return null;
 const pairs=clean.slice(i+key.length).match(/.{2}/g)||[];
 return pairs.map(x=>parseInt(x,16)).filter(Number.isFinite);
}
async function pid(pid,n,fn){
 const r=await cmd("01"+pid),b=bytesFor(r,pid);
 if(!b||b.length<n){supported[pid]=false;return null}
 supported[pid]=true;return fn(...b);
}
function put(id,val,unit=""){if(val===null||val===undefined){$(id).textContent="—";return}$(id).textContent=val+unit}
function gauge(prefix,val,min,max,fmt){
 if(val===null||!Number.isFinite(val)){put(prefix,"—");$(prefix+"Arc").setAttribute("stroke-dasharray","0 100");return}
 const ratio=Math.max(0,Math.min(1,(val-min)/(max-min)));
 $(prefix+"Arc").setAttribute("stroke-dasharray",`${ratio*100} 100`);
 $(prefix+"Needle").setAttribute("transform",`rotate(${-90+ratio*180} 100 108)`);
 put(prefix,fmt(val));
}
async function readVoltage(){const r=await cmd("ATRV"),m=r.match(/(\d+(?:\.\d+)?)\s*V/i);return m?Number(m[1]):null}
async function poll(){
 if(polling)return;polling=true;
 // Priority: speed and RPM every cycle. Slow-changing PIDs are staggered.
 let slowIndex=0;const slowTasks=[
  async()=>{const v=await pid("05",1,a=>a-40);gauge("coolant",v,40,120,x=>Math.round(x)+"°")},
  async()=>{const v=await pid("5C",1,a=>a-40);gauge("oil",v,50,150,x=>Math.round(x)+"°")},
  async()=>{const v=await pid("0B",1,a=>a);return v},
  async()=>{const v=await pid("33",1,a=>a);return v},
  async()=>{const v=await pid("04",1,a=>Math.round(a*100/255));put("load",v===null?null:v,"%")},
  async()=>{const v=await readVoltage();put("voltage",v===null?null:v.toFixed(1)+" V")}
 ];
 let map=null,baro=null;
 try{
  while(connected){
   const speed=await pid("0D",1,a=>a);put("speed",speed===null?null:Math.round(speed));$("speedbar").style.width=(speed===null?0:Math.min(100,speed/220*100))+"%";
   const rpm=await pid("0C",2,(a,b)=>Math.round((a*256+b)/4));put("rpm",rpm===null?null:rpm.toLocaleString("en-US"));$("rpmbar").style.width=(rpm===null?0:Math.min(100,rpm/5000*100))+"%";
   // one low-priority query per loop; boost is derived when MAP and BARO are both known
   try{
    const t=slowTasks[slowIndex]();slowIndex=(slowIndex+1)%slowTasks.length;
    const result=await t;
    if(slowIndex===3)map=result;
    if(slowIndex===4)baro=result;
    if(map!==null&&baro!==null){const boost=(map-baro)/100;gauge("boost",boost,0,2.5,x=>x.toFixed(2));}
   }catch(e){log("PID read: "+e.message)}
   $("lastUpdate").textContent="UPDATED "+new Date().toLocaleTimeString("ko-KR",{hour12:false});
   await delay(120);
  }
 }catch(e){log("Polling stopped: "+e.message)}
 polling=false;
}
async function start(){
 if(!navigator.bluetooth){throw Error("이 브라우저는 Web Bluetooth를 지원하지 않습니다. Android의 지원 브라우저에서 HTTPS로 실행하세요.")}
 setConn("SEARCHING BLE…");
 // Brand-agnostic discovery: user chooses any BLE device visible to the browser.
 device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices});
 log("Selected BLE device: "+(device.name||"Unnamed device"));
 device.addEventListener("gattserverdisconnected",()=>{
  connected=false;setConn("DISCONNECTED");$("disconnect").disabled=true;$("connect").disabled=false;log("GATT disconnected");
 });
 server=await device.gatt.connect();log("GATT connected");
 if(!await findProfile(server))throw Error("알려진 BLE OBD 서비스/특성을 찾지 못했습니다. 이 어댑터는 다른 BLE 프로토콜일 수 있습니다.");
 await rx.startNotifications();rx.addEventListener("characteristicvaluechanged",onNotify);
 connected=true;
 for(const c of ["ATZ","ATE0","ATL0","ATS0","ATH0","ATSP0"]){await cmd(c);await delay(120)}
 setConn("BLE CONNECTED",true);$("disconnect").disabled=false;$("connect").disabled=true;
 // Identify ECU support map using standard supported-PID bitmap.
 try{const r=await cmd("0100");log("Standard PID discovery response received");}catch(e){log("PID discovery: "+e.message)}
 poll();
}
$("connect").onclick=async()=>{ $("connect").disabled=true;try{await start()}catch(e){log("ERROR "+e.name+": "+e.message);setConn("CONNECTION FAILED");$("connect").disabled=false;if(device?.gatt?.connected)device.gatt.disconnect()}};
$("disconnect").onclick=()=>{connected=false;if(device?.gatt?.connected)device.gatt.disconnect();setConn("DISCONNECTED");$("connect").disabled=false;$("disconnect").disabled=true};
$("fullscreen").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){log("Fullscreen unavailable: "+e.message)}};
$("wake").onclick=async()=>{try{if(!("wakeLock"in navigator))throw Error("Wake Lock 미지원 브라우저");wakeLock=await navigator.wakeLock.request("screen");$("wake").textContent="SCREEN ON ✓";wakeLock.addEventListener("release",()=>$("wake").textContent="KEEP SCREEN ON")}catch(e){log("Wake Lock: "+e.message)}};
$("settings").onclick=()=>{$("diagnostics").style.display=$("diagnostics").style.display==="block"?"none":"block"};
if("serviceWorker"in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>log("SW registration: "+e.message)))}
if(!navigator.bluetooth){$("connect").disabled=true;setConn("WEB BLUETOOTH UNAVAILABLE")}
})();
</script>
</body></html>
